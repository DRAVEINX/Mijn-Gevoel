name: MoodPress Cloud Portal CI

on:
  push:
    branches:
      - moodpress-cloud-portal-crossplatform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodpress-cloud-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:

  android-client-compile:
    name: Compile Android phone and tablet cloud-sync client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and patch
        uses: actions/checkout@v7

      - name: Install .NET SDK 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Apply MoodPress 4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -t MoodPress-Android-compleet-2.5.2.zip
          mkdir -p source
          unzip -q MoodPress-Android-compleet-2.5.2.zip -d source
          test -d source/MijnGevoel-Android
          patch --batch --forward -p1 -d source/MijnGevoel-Android < MoodPress-4.0.0-github.patch
          cd source/MijnGevoel-Android
          bash scripts/check-moodpress-4.sh

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore and run core security tests
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --warnaserror

      - name: Restore Android project
        working-directory: source/MijnGevoel-Android
        run: dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj

      - name: Compile Android phone variant
        working-directory: source/MijnGevoel-Android
        run: dotnet build MijnGevoel.Android/MijnGevoel.Android.csproj --configuration Release --framework net10.0-android --no-restore -p:MoodPressTarget=Phone --warnaserror

      - name: Compile Android tablet variant
        working-directory: source/MijnGevoel-Android
        run: dotnet build MijnGevoel.Android/MijnGevoel.Android.csproj --configuration Release --framework net10.0-android --no-restore -p:MoodPressTarget=Tablet --warnaserror



      - name: Check Android release-signing configuration
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All Android release-signing settings are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing settings are incomplete. Only clearly labelled DEBUG preview packages will be produced."
          fi

      - name: Prepare Android release keystore
        if: steps.android_signing.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moodpress-release.keystore"
          test -s "$RUNNER_TEMP/moodpress-release.keystore"
          chmod 600 "$RUNNER_TEMP/moodpress-release.keystore"

      - name: Publish signed phone and tablet APK/AAB packages
        if: steps.android_signing.outputs.ready == 'true'
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          project="MijnGevoel.Android/MijnGevoel.Android.csproj"
          out_root="$GITHUB_WORKSPACE/artifacts/android-release"
          store_pass_file="$RUNNER_TEMP/android-store-password.txt"
          key_pass_file="$RUNNER_TEMP/android-key-password.txt"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$store_pass_file"
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$key_pass_file"
          chmod 600 "$store_pass_file" "$key_pass_file"
          mkdir -p "$out_root"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "Android SDK apksigner was not found; refusing to publish unverified APK files." >&2
            exit 1
          fi
          for target in Phone Tablet; do
            for format in apk aab; do
              out="$RUNNER_TEMP/moodpress-${target}-${format}"
              rm -rf "$out"
              dotnet publish "$project" \
                --configuration Release \
                --framework net10.0-android \
                -p:MoodPressTarget="$target" \
                -p:AndroidPackageFormat="$format" \
                -p:AndroidKeyStore=true \
                "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
                "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
                "-p:AndroidSigningKeyPass=file:$key_pass_file" \
                "-p:AndroidSigningStorePass=file:$store_pass_file" \
                --output "$out"
              artifact="$(find "$out" -type f -iname "*.$format" -print -quit)"
              if [[ -z "$artifact" || ! -f "$artifact" ]]; then
                echo "Missing signed $format package for $target." >&2
                find "$out" -type f -print || true
                exit 1
              fi
              if [[ "$format" == "apk" ]]; then
                "$apksigner" verify --verbose --print-certs "$artifact"
              else
                if ! unzip -Z1 "$artifact" | grep -Eq '^META-INF/[^/]+\.SF

      - name: Publish phone and tablet DEBUG preview APK/AAB packages
        if: steps.android_signing.outputs.ready != 'true'
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          project="MijnGevoel.Android/MijnGevoel.Android.csproj"
          out_root="$GITHUB_WORKSPACE/artifacts/android-debug"
          mkdir -p "$out_root"
          for target in Phone Tablet; do
            if [[ "$target" == "Phone" ]]; then
              appid="nl.moodpress.phone.preview"
              title="MoodPress Phone Preview"
            else
              appid="nl.moodpress.tablet.preview"
              title="MoodPress Tablet Preview"
            fi
            for format in apk aab; do
              out="$RUNNER_TEMP/moodpress-${target}-debug-${format}"
              rm -rf "$out"
              dotnet publish "$project" \
                --configuration Debug \
                --framework net10.0-android \
                -p:MoodPressTarget="$target" \
                -p:AndroidPackageFormat="$format" \
                -p:AndroidKeyStore=false \
                -p:ApplicationId="$appid" \
                "-p:ApplicationTitle=$title" \
                --output "$out"
              artifact="$(find "$out" -type f -iname "*.$format" -print -quit)"
              if [[ -z "$artifact" || ! -f "$artifact" ]]; then
                echo "Missing DEBUG $format package for $target." >&2
                find "$out" -type f -print || true
                exit 1
              fi
              cp "$artifact" "$out_root/MoodPress-4.0.0-${target}-DEBUG.${format}"
            done
          done
          cd "$out_root"
          sha256sum ./* | tee SHA256SUMS.txt
          printf '%s\n' 'Preview-only builds. Configure all four ANDROID_* GitHub Actions secrets for signed release packages.' > BUILD-STATUS.txt
          ls -lh

      - name: Upload signed Android phone/tablet release packages
        if: steps.android_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.0-Android-Phone-Tablet-Signed
          path: artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android phone/tablet DEBUG previews
        if: steps.android_signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.0-Android-Phone-Tablet-DEBUG-Preview
          path: artifacts/android-debug/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/moodpress-release.keystore" "$RUNNER_TEMP/android-store-password.txt" "$RUNNER_TEMP/android-key-password.txt"


  platform-source-audit:
    name: Inspect Windows and iOS project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract platform source packages
        run: |
          set -euo pipefail
          mkdir -p platform-source/windows platform-source/ios
          unzip -q MoodPress-Windows-source-2.3.0.zip -d platform-source/windows
          unzip -q MoodPress-iOS-compleet-2.3.2.zip -d platform-source/ios
          find platform-source/windows -name '*.csproj' -print | sort
          find platform-source/ios -name '*.csproj' -print | sort
          find platform-source/windows -name 'FeaturePage.cs' -o -name 'DashboardPage.cs' -o -name 'AppSession.cs' -o -name 'BackupService.cs' | sort
          find platform-source/ios -name 'FeaturePage.cs' -o -name 'DashboardPage.cs' -o -name 'AppSession.cs' -o -name 'BackupService.cs' | sort
          echo '--- WINDOWS APP PROJECT ---'
          sed -n '1,180p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/MoodPress.WindowsApp.csproj
          echo '--- WINDOWS SESSION / DASHBOARD HEAD ---'
          sed -n '1,130p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/AppSession.cs
          sed -n '1,100p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/DashboardPage.cs
          echo '--- WINDOWS FEATURE PAGE HEAD ---'
          sed -n '1,140p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/FeaturePage.cs
          echo '--- IOS PROJECT ---'
          sed -n '1,180p' platform-source/ios/MijnGevoel-Android/MijnGevoel.Android/MoodPress.iOS.csproj
          echo '--- IOS MAIN PROJECT TARGET ---'
          sed -n '1,100p' platform-source/ios/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj


      - name: Package extracted source for detailed parity implementation
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/MoodPress-Android-compleet-2.5.2.zip" platform-source/android-source.zip
          cp "$GITHUB_WORKSPACE/MoodPress-4.0.0-github.patch" platform-source/android-feature-patch.patch
          cd platform-source
          zip -qr "$RUNNER_TEMP/moodpress-platform-source-audit.zip" windows ios android-source.zip android-feature-patch.patch
      - name: Upload platform source audit bundle
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-platform-source-audit
          path: ${{ runner.temp }}/moodpress-platform-source-audit.zip
          if-no-files-found: error
          retention-days: 1


  build-and-smoke-test:
    name: Build and test cloud API / support portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and compile with warnings as errors
        run: |
          dotnet restore cloud/MoodPress.CloudPortal.csproj
          dotnet build cloud/MoodPress.CloudPortal.csproj --configuration Release --no-restore --warnaserror

      - name: Start test server and run API smoke tests
        shell: bash
        env:
          MOODPRESS_DATABASE_PATH: ${{ runner.temp }}/moodpress-cloud-test.db
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          MOODPRESS_TEST_URL: http://127.0.0.1:5080
        run: |
          set -euo pipefail
          rm -f "$MOODPRESS_DATABASE_PATH" "$MOODPRESS_DATABASE_PATH-wal" "$MOODPRESS_DATABASE_PATH-shm"
          (
            cd cloud
            dotnet bin/Release/net10.0/MoodPress.CloudPortal.dll
          ) > "$RUNNER_TEMP/moodpress-cloud-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 scripts/cloud-portal-smoke.py
          echo "Portal assets and API endpoints are reachable."
          cat "$RUNNER_TEMP/moodpress-cloud-server.log"
 || ! unzip -Z1 "$artifact" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)

      - name: Publish phone and tablet DEBUG preview APK/AAB packages
        if: steps.android_signing.outputs.ready != 'true'
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          project="MijnGevoel.Android/MijnGevoel.Android.csproj"
          out_root="$GITHUB_WORKSPACE/artifacts/android-debug"
          mkdir -p "$out_root"
          for target in Phone Tablet; do
            if [[ "$target" == "Phone" ]]; then
              appid="nl.moodpress.phone.preview"
              title="MoodPress Phone Preview"
            else
              appid="nl.moodpress.tablet.preview"
              title="MoodPress Tablet Preview"
            fi
            for format in apk aab; do
              out="$RUNNER_TEMP/moodpress-${target}-debug-${format}"
              rm -rf "$out"
              dotnet publish "$project" \
                --configuration Debug \
                --framework net10.0-android \
                -p:MoodPressTarget="$target" \
                -p:AndroidPackageFormat="$format" \
                -p:AndroidKeyStore=false \
                -p:ApplicationId="$appid" \
                "-p:ApplicationTitle=$title" \
                --output "$out"
              artifact="$(find "$out" -type f -iname "*.$format" -print -quit)"
              if [[ -z "$artifact" || ! -f "$artifact" ]]; then
                echo "Missing DEBUG $format package for $target." >&2
                find "$out" -type f -print || true
                exit 1
              fi
              cp "$artifact" "$out_root/MoodPress-4.0.0-${target}-DEBUG.${format}"
            done
          done
          cd "$out_root"
          sha256sum ./* | tee SHA256SUMS.txt
          printf '%s\n' 'Preview-only builds. Configure all four ANDROID_* GitHub Actions secrets for signed release packages.' > BUILD-STATUS.txt
          ls -lh

      - name: Upload signed Android phone/tablet release packages
        if: steps.android_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.0-Android-Phone-Tablet-Signed
          path: artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android phone/tablet DEBUG previews
        if: steps.android_signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.0-Android-Phone-Tablet-DEBUG-Preview
          path: artifacts/android-debug/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/moodpress-release.keystore"


  platform-source-audit:
    name: Inspect Windows and iOS project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract platform source packages
        run: |
          set -euo pipefail
          mkdir -p platform-source/windows platform-source/ios
          unzip -q MoodPress-Windows-source-2.3.0.zip -d platform-source/windows
          unzip -q MoodPress-iOS-compleet-2.3.2.zip -d platform-source/ios
          find platform-source/windows -name '*.csproj' -print | sort
          find platform-source/ios -name '*.csproj' -print | sort
          find platform-source/windows -name 'FeaturePage.cs' -o -name 'DashboardPage.cs' -o -name 'AppSession.cs' -o -name 'BackupService.cs' | sort
          find platform-source/ios -name 'FeaturePage.cs' -o -name 'DashboardPage.cs' -o -name 'AppSession.cs' -o -name 'BackupService.cs' | sort
          echo '--- WINDOWS APP PROJECT ---'
          sed -n '1,180p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/MoodPress.WindowsApp.csproj
          echo '--- WINDOWS SESSION / DASHBOARD HEAD ---'
          sed -n '1,130p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/AppSession.cs
          sed -n '1,100p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/DashboardPage.cs
          echo '--- WINDOWS FEATURE PAGE HEAD ---'
          sed -n '1,140p' platform-source/windows/MoodPress-Windows-source-2.3.0/MoodPress.WindowsApp/FeaturePage.cs
          echo '--- IOS PROJECT ---'
          sed -n '1,180p' platform-source/ios/MijnGevoel-Android/MijnGevoel.Android/MoodPress.iOS.csproj
          echo '--- IOS MAIN PROJECT TARGET ---'
          sed -n '1,100p' platform-source/ios/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj


      - name: Package extracted source for detailed parity implementation
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/MoodPress-Android-compleet-2.5.2.zip" platform-source/android-source.zip
          cp "$GITHUB_WORKSPACE/MoodPress-4.0.0-github.patch" platform-source/android-feature-patch.patch
          cd platform-source
          zip -qr "$RUNNER_TEMP/moodpress-platform-source-audit.zip" windows ios android-source.zip android-feature-patch.patch
      - name: Upload platform source audit bundle
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-platform-source-audit
          path: ${{ runner.temp }}/moodpress-platform-source-audit.zip
          if-no-files-found: error
          retention-days: 1


