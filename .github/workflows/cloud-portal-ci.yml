            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 scripts/cloud-portal-smoke.py
          echo "Portal assets and API endpoints are reachable."
          cat "$RUNNER_TEMP/moodpress-cloud-server.log"
; then
                  echo "AAB is missing JAR signature files: $artifact" >&2
                  exit 1
                fi
                verify_output="$(jarsigner -verify -verbose "$artifact" 2>&1)" || { printf '%s\n' "$verify_output"; exit 1; }
                if ! printf '%s\n' "$verify_output" | grep -qi 'jar verified\.'; then
                  printf '%s\n' "$verify_output"
                  echo "AAB JAR signature could not be verified: $artifact" >&2
