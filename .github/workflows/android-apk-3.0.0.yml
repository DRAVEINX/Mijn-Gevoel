name: MoodPress 3.0.0 - Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/complete-accessible-upgrade
    paths:
      - 'MoodPress-Android-compleet-3.0.0.zip'

permissions:
  contents: read

concurrency:
  group: moodpress-android-3.0.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Core-tests en Android test-APK
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4

      - name: Controleer en pak de nieuwe broncode uit
        shell: bash
        run: |
          set -euo pipefail
          zip_file='MoodPress-Android-compleet-3.0.0.zip'
          test -f "$zip_file" || { echo "Upload eerst $zip_file naar deze branch." >&2; exit 1; }
          unzip -t "$zip_file"
          mkdir -p source
          unzip -q "$zip_file" -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Controleer versie en rolgerichte functies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root=Path('source/MijnGevoel-Android')
          tree=ET.parse(root/'MijnGevoel.Android/MijnGevoel.Android.csproj')
          def prop(name):
              values=[e.text or '' for e in tree.iter(name)]
              return values[-1] if values else None
          actual=(prop('TargetFramework'),prop('ApplicationId'),prop('ApplicationTitle'),prop('ApplicationDisplayVersion'),prop('ApplicationVersion'))
          expected=('net10.0-android','nl.mijngevoel.app','MoodPress','3.0.0','35')
          if actual != expected: raise SystemExit(f'Versieconfiguratie wijkt af: {actual}; verwacht {expected}')
          must=[
            'MijnGevoel.Core/Data/WorkspaceRoleService.cs',
            'MijnGevoel.Core/Data/WorkspaceRecordService.cs',
            'MijnGevoel.Android/WorkspacePage.cs',
            'MijnGevoel.Android/SpeechInput.cs',
            'MijnGevoel.Desktop/Views/WorkspaceView.cs',
            'MijnGevoel.Tests/WorkspaceRoleServiceTests.cs',
            'RELEASE-NOTES-3.0.0.md',
            'docs/quality/WORKSPACES-3.0.0.md']
          missing=[p for p in must if not (root/p).is_file()]
          if missing: raise SystemExit('Ontbrekende bestanden: '+', '.join(missing))
          dashboard=(root/'MijnGevoel.Android/DashboardPage.cs').read_text(encoding='utf-8')
          match=re.search(r'public enum FeatureKind\s*\{([^}]+)\}',dashboard,re.S)
          if not match: raise SystemExit('FeatureKind ontbreekt')
          kinds=[x.strip() for x in match.group(1).replace('\n',' ').split(',') if x.strip()]
          catalog=(root/'MijnGevoel.Android/FeatureCatalog.cs').read_text(encoding='utf-8')
          entries=re.findall(r'new\(FeatureKind\.(\w+),',catalog)
          if len(kinds)!=len(entries) or set(kinds)!=set(entries): raise SystemExit('Featurecatalogus sluit niet aan op FeatureKind')
          if not {'PersonalSpace','CaregiverSpace','ParentGuardianSpace'}.issubset(set(kinds)): raise SystemExit('Workspace-functies ontbreken')
          print(f'Preflight geslaagd: MoodPress {actual[3]}, {len(kinds)} functies')
          PY

      - name: Installeer .NET SDK's
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Installeer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Installeer MAUI Android-workload
        run: dotnet workload install maui-android

      - name: Voer Core-tests uit
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Bouw Android Debug-test-APK
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Debug \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationId=nl.mijngevoel.app.debug \
            "-p:ApplicationTitle=MoodPress Test"

      - name: Valideer en bewaar testresultaten
        shell: bash
        run: |
          set -euo pipefail
          output='source/MijnGevoel-Android/MijnGevoel.Android/bin/Debug/net10.0-android'
          apk="$(find "$output" -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -f "$apk"
          unzip -t "$apk"
          mkdir -p artifacts
          cp "$apk" artifacts/MoodPress-Android-3.0.0-debug.apk
          cp MoodPress-Android-compleet-3.0.0.zip artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Upload test APK, broncode en SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Android-3.0.0-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
