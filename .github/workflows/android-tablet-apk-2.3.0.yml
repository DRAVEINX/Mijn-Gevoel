name: MoodPress Tablet 2.3.0 - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MoodPress-Android-Tablet-2.3.0.zip'
      - '.github/workflows/android-apk-2.3.0.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v7

      - name: Controleer broncode-ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file='MoodPress-Android-Tablet-2.3.0.zip'
          test -f "$zip_file" || { echo "Upload eerst $zip_file naar de hoofdmap." >&2; exit 1; }
          unzip -t "$zip_file"
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"

      - name: Pak het project uit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Controleer versie, icoon en tekstveld-fix
        shell: bash
        run: |
          set -euo pipefail
          project='source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj'
          grep -q '<TargetFramework>net10.0-android</TargetFramework>' "$project"
          grep -q '<ApplicationDisplayVersion>2.3.0</ApplicationDisplayVersion>' "$project"
          grep -q '<ApplicationVersion>28</ApplicationVersion>' "$project"
          grep -q '<ApplicationId>nl.mijngevoel.app.tablet</ApplicationId>' "$project"
          grep -q '<ApplicationTitle>MoodPress Tablet</ApplicationTitle>' "$project"
          grep -Fq 'ForegroundScale="1.0"' "$project"
          grep -Fq 'viewBox="0 0 456 456"' source/MijnGevoel-Android/MijnGevoel.Android/Resources/AppIcon/appiconfg.svg
          grep -Fq 'AutoSize = EditorAutoSizeOption.TextChanges' source/MijnGevoel-Android/MijnGevoel.Android/AppUi.cs
          grep -q 'android.permission.POST_NOTIFICATIONS' source/MijnGevoel-Android/MijnGevoel.Android/Platforms/Android/AndroidManifest.xml
          grep -Fq 'using Microsoft.Maui.Controls.Shapes;' source/MijnGevoel-Android/MijnGevoel.Android/DashboardPage.cs
          grep -Fq 'class SupporterCenterPage' source/MijnGevoel-Android/MijnGevoel.Android/SupporterCenterPage.cs
          grep -Fq 'class SupporterColorGuidePage' source/MijnGevoel-Android/MijnGevoel.Android/SupporterCenterPage.cs
          grep -Fq 'class ChildSchedulePage' source/MijnGevoel-Android/MijnGevoel.Android/SupportPackagePages.cs
          grep -Fq 'SelectedItemLabels' source/MijnGevoel-Android/MijnGevoel.Core/Data/Models.cs
          grep -Fq 'class MoodPressRoadmapModelTests' source/MijnGevoel-Android/MijnGevoel.Tests/SecurityTests.cs

      - name: Installeer .NET SDK's
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Installeer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Installeer Android workload
        run: dotnet workload install maui-android

      - name: Voer tests uit
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Bouw Android APK
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj --configuration Debug --framework net10.0-android -p:AndroidPackageFormat=apk

      - name: Controleer APK en maak checksum
        shell: bash
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          apk="$(find MijnGevoel.Android/bin/Debug/net10.0-android -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -f "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/artifacts/MoodPress-Tablet-debug.apk"
          cp "$GITHUB_WORKSPACE/$ZIP_FILE" "$GITHUB_WORKSPACE/artifacts/MoodPress-Android-Tablet-2.3.0.zip"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum MoodPress-Tablet-debug.apk MoodPress-Android-Tablet-2.3.0.zip | tee SHA256SUMS.txt
          ls -lh

      - name: Maak bestanden downloadbaar
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-Tablet-debug-apk-2.3.0
          path: |
            artifacts/MoodPress-Tablet-debug.apk
            artifacts/MoodPress-Android-Tablet-2.3.0.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
