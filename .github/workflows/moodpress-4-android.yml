name: MoodPress 4.0 Android — telefoon en tablet

on:
  push:
    branches:
      - moodpress-4.0-build
      - moodpress-cloud-portal-crossplatform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodpress-4-android-feature-directory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test en bouw MoodPress 4.0 voor telefoon en tablet
    runs-on: ubuntu-latest
    steps:
      - name: Voorkom Git-init-hint op de runner
        shell: bash
        run: git config --global init.defaultBranch main

      - name: Haal de aparte build-branch op
        uses: actions/checkout@v7

      - name: Controleer en patch de bestaande MoodPress 2.5.2-broncode
        shell: bash
        run: |
          set -euo pipefail
          base_zip="MoodPress-Android-compleet-2.5.2.zip"
          test -f "$base_zip" || { echo "Broncodebestand ontbreekt: $base_zip" >&2; exit 1; }
          test -f MoodPress-4.0.1-github.patch || { echo "De 4.0-patch ontbreekt." >&2; exit 1; }
          unzip -t "$base_zip"
          mkdir -p source
          unzip -q "$base_zip" -d source
          test -d source/MijnGevoel-Android || { echo "Verwachte broncodemap ontbreekt." >&2; exit 1; }
          patch --batch --forward -p1 -d source/MijnGevoel-Android < MoodPress-4.0.1-github.patch
          python3 scripts/fix-moodpress-feature-directory.py source/MijnGevoel-Android
          cd source/MijnGevoel-Android
          bash scripts/check-moodpress-4.sh
          grep -q 'if (_focusVoiceCapture) _ = FocusVoiceCaptureAsync();' MijnGevoel.Android/FeaturePage.cs
          grep -q 'ScrollToAsync(target, ScrollToPosition.Center, true)' MijnGevoel.Android/FeaturePage.cs
          grep -q '<ApplicationDisplayVersion>4.0.1</ApplicationDisplayVersion>' MijnGevoel.Android/MijnGevoel.Android.csproj
          grep -q '<ApplicationVersion>36</ApplicationVersion>' MijnGevoel.Android/MijnGevoel.Android.csproj
          echo "MoodPress 4.0 source patch applied and static checks passed."

      - name: Bewaar Android-schermen voor diagnose van ontbrekende functies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-Android-navigation-diagnostics
          path: |
            source/MijnGevoel-Android/MijnGevoel.Android/MorePage.cs
            source/MijnGevoel-Android/MijnGevoel.Android/FeatureCatalog.cs
            source/MijnGevoel-Android/MijnGevoel.Android/DashboardPage.cs
            source/MijnGevoel-Android/MijnGevoel.Android/AppUi.cs
            source/MijnGevoel-Android/MijnGevoel.Android/FeaturePage.cs
          if-no-files-found: warn
          retention-days: 7

      - name: Controleer cloudsync en ouder-/begeleidersportaal in Android-broncode
        shell: bash
        run: |
          set -euo pipefail
          app="source/MijnGevoel-Android/MijnGevoel.Android"
          test -f "$app/CloudSyncClient.cs"
          test -f "$app/CloudArchiveMerger.cs"
          test -f "$app/FeaturePage.CloudSync.cs"
          grep -q 'TryAutoSyncAsync' "$app/AppSession.cs"
          grep -q '/api/v1/auth/register' "$app/CloudSyncClient.cs"
          grep -q '/api/v1/auth/login' "$app/CloudSyncClient.cs"
          grep -q '/api/v1/sync' "$app/CloudSyncClient.cs"
          grep -q 'SecureStorage' "$app/CloudSyncClient.cs"
          grep -q '/api/v1/support/invitations' cloud/Program.cs
          grep -q '/api/v1/support/shares' cloud/Program.cs
          grep -q '/api/v1/support/suggestions' cloud/Program.cs
          echo "Android bevat de versleutelde sync-client; de cloud-API bevat account-, sync- en begeleiderportaalroutes."

      - name: Installeer .NET SDK 8 en 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Bouw het bijbehorende onlineportaal en de cloud-API
        shell: bash
        run: |
          set -euo pipefail
          dotnet build cloud/MoodPress.CloudPortal.csproj --configuration Release --warnaserror

      - name: Installeer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Installeer MAUI Android-workload
        run: dotnet workload install maui-android

      - name: Herstel en voer automatische tests uit
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal" -warnaserror

      - name: Controleer of release-ondertekening beschikbaar is
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" && -n "${ANDROID_KEY_PASSWORD:-}" && -n "${ANDROID_KEY_ALIAS:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; only installable debug APKs will be produced in this run."
          fi

      - name: Decodeer de bestaande Android-ondertekeningssleutel
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moodpress-release.keystore"
          test -s "$RUNNER_TEMP/moodpress-release.keystore"
          chmod 600 "$RUNNER_TEMP/moodpress-release.keystore"

      - name: Bouw vier ondertekende releasebestanden
        if: steps.signing.outputs.ready == 'true'
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          project="MijnGevoel.Android/MijnGevoel.Android.csproj"
          store_pass_file="$RUNNER_TEMP/android-store-password.txt"
          key_pass_file="$RUNNER_TEMP/android-key-password.txt"
          printf "%s" "$ANDROID_KEYSTORE_PASSWORD" > "$store_pass_file"
          printf "%s" "$ANDROID_KEY_PASSWORD" > "$key_pass_file"
          chmod 600 "$store_pass_file" "$key_pass_file"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -x "$apksigner" ]]; then
            echo "Android SDK apksigner was not found; refusing to publish unverified APK files." >&2
            exit 1
          fi
          for target in Phone Tablet; do
            for format in apk aab; do
              out="$RUNNER_TEMP/moodpress-${target}-${format}"
              rm -rf "$out"
              dotnet publish "$project" --configuration Release --framework net10.0-android -p:MoodPressTarget="$target" -warnaserror -p:AndroidPackageFormat="$format" -p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" "-p:AndroidSigningKeyPass=file:$key_pass_file" "-p:AndroidSigningStorePass=file:$store_pass_file" --output "$out"
              if [[ "$format" == "aab" ]]; then
                # Explicitly sign the unsigned App Bundle; the generated -Signed.aab lacked a valid JAR manifest.
                unsigned_aab="$(find "$out" -type f -iname '*.aab' ! -iname '*-signed.aab' -print -quit)"
                if [[ -z "$unsigned_aab" || ! -f "$unsigned_aab" ]]; then
                  echo "No unsigned AAB input found for $target; generated files:" >&2
                  find "$out" -type f -print || true
                  exit 1
                fi
                artifact="$out/MoodPress-${target}-manual-signed.aab"
                rm -f "$artifact"
                jarsigner -keystore "$RUNNER_TEMP/moodpress-release.keystore" \
                  -storepass:file "$store_pass_file" \
                  -keypass:file "$key_pass_file" \
                  -sigalg SHA256withRSA -digestalg SHA-256 \
                  -signedjar "$artifact" "$unsigned_aab" "$ANDROID_KEY_ALIAS"
              else
                artifact="$(find "$out" -type f -iname '*-signed.apk' -print -quit)"
                if [[ -z "$artifact" ]]; then
                  # dotnet publish can place an already-signed APK at the plain .apk path.
                  artifact="$(find "$out" -type f -iname '*.apk' -print -quit)"
                fi
              fi
              if [[ -z "$artifact" || ! -f "$artifact" ]]; then
                echo "No signed $format artifact found for $target; generated files:" >&2
                find "$out" -type f -print || true
                echo "Geen $format aangetroffen voor $target." >&2
                find "$out" -type f -print || true
                exit 1
              fi
              if [[ "$format" == "apk" ]]; then
                "$apksigner" verify --verbose --print-certs "$artifact"
              else
                if ! unzip -Z1 "$artifact" | grep -Eqi '^META-INF/MANIFEST[.]MF$'; then
                  echo "AAB is missing META-INF/MANIFEST.MF: $artifact" >&2
                  exit 1
                fi
                if ! unzip -Z1 "$artifact" | grep -Eq "^META-INF/[^/]+[.]SF$" || ! unzip -Z1 "$artifact" | grep -Eq "^META-INF/[^/]+[.](RSA|DSA|EC)$"; then
                  echo "AAB mist JAR-handtekeningbestanden: $artifact" >&2
                  exit 1
                fi
                verify_output="$(jarsigner -verify -verbose "$artifact" 2>&1)" || { printf "%s\n" "$verify_output"; exit 1; }
                if ! printf "%s\n" "$verify_output" | grep -qi "jar verified[.]"; then
                  printf "%s\n" "$verify_output"
                  echo "AAB-handtekening kon niet worden gevalideerd: $artifact" >&2
                  exit 1
                fi
              fi
              cp "$artifact" "$GITHUB_WORKSPACE/artifacts/MoodPress-4.0.1-${target}.${format}"
            done
          done
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum MoodPress-4.0.1-Phone.apk MoodPress-4.0.1-Phone.aab MoodPress-4.0.1-Tablet.apk MoodPress-4.0.1-Tablet.aab | tee SHA256SUMS.txt
          ls -lh
      - name: Bouw een debug-APK voor telefoon en tablet als release-sleutels ontbreken
        if: steps.signing.outputs.ready != 'true'
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          project="MijnGevoel.Android/MijnGevoel.Android.csproj"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          for target in Phone Tablet; do
            out="$RUNNER_TEMP/moodpress-${target}-debug"
            rm -rf "$out"
            appid="nl.mijngevoel.app.debug"
            title="MoodPress Phone Test"
            if [[ "$target" == "Tablet" ]]; then appid="nl.mijngevoel.app.tablet.debug"; title="MoodPress Tablet Test"; fi
            dotnet publish "$project" \
              --configuration Debug \
              --framework net10.0-android \
              -p:MoodPressTarget="$target" \
              -p:AndroidPackageFormat=apk \
              -p:ApplicationId="$appid" \
              "-p:ApplicationTitle=$title" \
              --output "$out"
            apk="$(find "$out" -type f -iname '*.apk' -print -quit)"
            test -n "$apk" && test -f "$apk"
            cp "$apk" "$GITHUB_WORKSPACE/artifacts/MoodPress-4.0.1-${target}-DEBUG.apk"
          done
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum MoodPress-4.0.1-Phone-DEBUG.apk MoodPress-4.0.1-Tablet-DEBUG.apk | tee SHA256SUMS.txt
          printf '%s\n' 'Alleen debug-APK-bestanden zijn gemaakt; voor ondertekende APK/AAB-releases moeten de vier ANDROID_* GitHub Secrets zijn ingesteld.' > BUILD-STATUS.txt
          ls -lh

      - name: Upload MoodPress 4.0-releasebestanden
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.1-Android-Phone-Tablet-Release
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload MoodPress 4.0-debugbestanden
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-4.0.1-Android-Phone-Tablet-Debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Verwijder tijdelijke ondertekeningssleutel
        if: always()
        run: rm -f "$RUNNER_TEMP/moodpress-release.keystore" "$RUNNER_TEMP/android-store-password.txt" "$RUNNER_TEMP/android-key-password.txt"
