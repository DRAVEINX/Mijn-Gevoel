name: MoodPress Windows MSI

on:
  workflow_dispatch:
  push:
    paths:
      - "MoodPress-Android-compleet-2.3.0.zip"
      - ".github/workflows/moodpress-windows-msi-2.3.0.yml"

permissions:
  contents: read

concurrency:
  group: moodpress-windows-msi
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test, build and package Windows desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract the source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "MoodPress-Android-compleet-2.3.0.zip"
          if (!(Test-Path $archive)) {
            throw "Source archive not found: MoodPress-Android-compleet-2.3.0.zip"
          }
          $sourceRoot = Join-Path $env:RUNNER_TEMP "moodpress-source"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $sourceRoot -Force
          "MOODPRESS_SOURCE=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $desktop = Get-ChildItem $sourceRoot -Recurse -Filter "MijnGevoel.Desktop.csproj" |
            Select-Object -First 1
          $core = Get-ChildItem $sourceRoot -Recurse -Filter "MijnGevoel.Core.csproj" |
            Select-Object -First 1
          $tests = Get-ChildItem $sourceRoot -Recurse -Filter "MijnGevoel.Tests.csproj" |
            Select-Object -First 1

          if (!$desktop) {
            Get-ChildItem $sourceRoot -Recurse -Filter "*.csproj" | ForEach-Object { Write-Host $_.FullName }
            throw "The archive does not contain MijnGevoel.Desktop.csproj. Check that the latest full source archive was uploaded."
          }
          if (!$core) { throw "MijnGevoel.Core.csproj was not found in the source archive." }
          if (!$tests) { throw "MijnGevoel.Tests.csproj was not found in the source archive." }

          # Package.wxs and the installer resources live at the solution root,
          # one directory above the desktop project folder.
          $projectRoot = Split-Path (Split-Path $desktop.FullName -Parent) -Parent
          if (!(Test-Path (Join-Path $projectRoot "installer\Package.wxs"))) {
            throw "installer\Package.wxs was not found next to the desktop project root: $projectRoot"
          }
          "MOODPRESS_PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOODPRESS_DESKTOP_PROJECT=$($desktop.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOODPRESS_CORE_PROJECT=$($core.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOODPRESS_TESTS_PROJECT=$($tests.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Project root: $projectRoot"
          Write-Host "Desktop:      $($desktop.FullName)"
          Write-Host "Core:         $($core.FullName)"
          Write-Host "Tests:        $($tests.FullName)"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run shared security and regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet test "$env:MOODPRESS_TESTS_PROJECT" --configuration Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "MoodPress regression tests failed." }

      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = Join-Path $env:MOODPRESS_PROJECT_ROOT "publish"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          dotnet restore "$env:MOODPRESS_DESKTOP_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed." }
          dotnet publish "$env:MOODPRESS_DESKTOP_PROJECT" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output "$publishDir"
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop publish failed." }

          # Package.wxs currently refers to MijnGevoel.exe while the desktop
          # project's AssemblyName is MoodPress. Provide that filename for MSI
          # packaging without changing the desktop project or Android builds.
          $builtExe = Join-Path $publishDir "MoodPress.exe"
          $installerExe = Join-Path $publishDir "MijnGevoel.exe"
          if (!(Test-Path $builtExe)) { throw "Expected desktop executable not found: $builtExe" }
          Copy-Item -LiteralPath $builtExe -Destination $installerExe -Force
          Write-Host "Published desktop app: $builtExe"

      - name: Build MSI with the existing WiX 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:MOODPRESS_PROJECT_ROOT
          $wxs = Join-Path $env:MOODPRESS_PROJECT_ROOT "installer\Package.wxs"
          foreach ($asset in @(
            "installer\Voorwaarden.rtf",
            "installer\banner.bmp",
            "installer\dialoog.bmp",
            "MijnGevoel.Desktop\Assets\MijnGevoel.ico"
          )) {
            if (!(Test-Path (Join-Path $env:MOODPRESS_PROJECT_ROOT $asset))) {
              throw "Required MSI asset is missing: $asset"
            }
          }
          if (!(Test-Path $wxs)) { throw "WiX source not found: $wxs" }

          # Use the same WiX 5 CLI workflow as bouwen.bat. A .wixproj is not
          # required for this existing .wxs-based installer.
          $installedWix = dotnet tool list --global | Select-String '^\s*wix\s'
          if ($installedWix) {
            dotnet tool update --global wix --version 5.0.2
          } else {
            dotnet tool install --global wix --version 5.0.2
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not install or update the WiX 5 CLI." }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"

          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Could not install the WiX UI extension." }

          wix build installer\Package.wxs `
            -ext WixToolset.UI.wixext `
            -culture nl-NL `
            -arch x64 `
            -d PublishDir=publish `
            -o MoodPress-Windows-Setup.msi
          if ($LASTEXITCODE -ne 0) { throw "WiX failed to build MoodPress-Windows-Setup.msi." }
          if (!(Test-Path "MoodPress-Windows-Setup.msi")) { throw "WiX finished without producing the MSI." }

          # This renamed copy is only used while WiX embeds the executable.
          Remove-Item -LiteralPath (Join-Path $env:MOODPRESS_PROJECT_ROOT "publish\MijnGevoel.exe") -Force
          Write-Host "MSI created: $env:MOODPRESS_PROJECT_ROOT\MoodPress-Windows-Setup.msi"

      - name: Collect MSI, portable build and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $msi = Join-Path $env:MOODPRESS_PROJECT_ROOT "MoodPress-Windows-Setup.msi"
          if (!(Test-Path $msi)) { throw "The Windows installer was not produced: $msi" }
          Copy-Item -LiteralPath $msi -Destination (Join-Path $artifactDir "MoodPress-Windows-Setup.msi") -Force

          $publishDir = Join-Path $env:MOODPRESS_PROJECT_ROOT "publish"
          if (!(Test-Path (Join-Path $publishDir "MoodPress.exe"))) {
            throw "The published desktop executable is missing: $publishDir\MoodPress.exe"
          }
          $portable = Join-Path $artifactDir "MoodPress-Windows-Portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -Path (Join-Path $publishDir "*") -Destination $portable -Recurse -Force
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath (Join-Path $artifactDir "MoodPress-Windows-Portable.zip") -Force

          Get-ChildItem $artifactDir -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Substring($artifactDir.Length + 1))" } |
            Set-Content (Join-Path $artifactDir "SHA256SUMS.txt")

          Get-ChildItem $artifactDir -File -Recurse | Select-Object FullName, Length

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Windows-2.3.0
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 30
