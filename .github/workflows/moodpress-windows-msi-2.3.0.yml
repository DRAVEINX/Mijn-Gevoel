name: MoodPress Windows MSI

on:
  workflow_dispatch:
  push:
    paths:
      - "MoodPress-Windows-source-2.3.0.zip"
      - "MoodPress-Windows-source-2.3.0-fixed.zip"
      - ".github/workflows/moodpress-windows-msi-2.3.0.yml"
      - "scripts/apply-cloud-platform.py"
      - "MoodPress-4.0.0-github.patch"

permissions:
  contents: read

concurrency:
  group: moodpress-windows-msi
  cancel-in-progress: false

jobs:
  build-windows:
    name: Test and build the full MoodPress Windows app
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify and extract the Windows source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archiveCandidates = @(
            (Join-Path $env:GITHUB_WORKSPACE "MoodPress-Windows-source-2.3.0.zip"),
            (Join-Path $env:GITHUB_WORKSPACE "MoodPress-Windows-source-2.3.0-fixed.zip")
          )
          $archive = $archiveCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$archive) {
            throw "Missing MoodPress-Windows-source-2.3.0.zip. Upload the separate Windows source archive first."
          }
          Write-Host "Using Windows source archive: $archive"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "moodpress-windows-source"
          $androidRoot = Join-Path $env:RUNNER_TEMP "moodpress-android-current"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $androidRoot | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $sourceRoot -Force
          Expand-Archive -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "MoodPress-Android-compleet-2.5.2.zip") -DestinationPath $androidRoot -Force
          python scripts/apply-cloud-platform.py --target windows --source-root $sourceRoot --android-source-root $androidRoot --repo-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Could not apply the shared encrypted cloud-sync/portal client to the Windows source." }
          $projectRoot = Join-Path $sourceRoot "MoodPress-Windows-source-2.3.0"
          $appProject = Join-Path $projectRoot "MoodPress.WindowsApp\MoodPress.WindowsApp.csproj"
          $testsProject = Join-Path $projectRoot "MijnGevoel.Tests\MijnGevoel.Tests.csproj"
          $installerSource = Join-Path $projectRoot "installer\Package.wxs"
          if (!(Test-Path $appProject)) { throw "Windows app project missing: $appProject" }
          if (!(Test-Path $testsProject)) { throw "Regression tests missing: $testsProject" }
          if (!(Test-Path $installerSource)) { throw "MoodPress installer source missing: $installerSource" }
          "MOODPRESS_PROJECT_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOODPRESS_WINDOWS_PROJECT=$appProject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOODPRESS_TESTS_PROJECT=$testsProject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Windows project: $appProject"
          Write-Host "Shared tests:    $testsProject"
          Write-Host "Installer:       $installerSource"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the .NET MAUI Windows workload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet workload install maui-windows
          if ($LASTEXITCODE -ne 0) { throw "Could not install the .NET MAUI Windows workload." }

      - name: Run core security and regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet test "$env:MOODPRESS_TESTS_PROJECT" --configuration Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "MoodPress core security/regression tests failed." }

      - name: Restore and publish the complete MoodPress Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = Join-Path $env:MOODPRESS_PROJECT_ROOT "publish"
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }
          dotnet restore "$env:MOODPRESS_WINDOWS_PROJECT"
          if ($LASTEXITCODE -ne 0) { throw "Windows app restore failed." }
          dotnet publish "$env:MOODPRESS_WINDOWS_PROJECT" `
            --configuration Release `
            --framework net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifierOverride=win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false `
            -p:NoWarn=MSB3277 `
            --output "$publishDir"
          if ($LASTEXITCODE -ne 0) { throw "MoodPress Windows publish failed." }
          if (!(Test-Path (Join-Path $publishDir "MoodPress.exe"))) { throw "MoodPress.exe was not produced." }
          Write-Host "Published files:" 
          Get-ChildItem $publishDir -File | Select-Object Name, Length

      - name: Install WiX 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installed = dotnet tool list --global | Select-String '^\s*wix\s'
          if ($installed) {
            dotnet tool update --global wix --version 5.0.2
          } else {
            dotnet tool install --global wix --version 5.0.2
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not install WiX 5.0.2." }
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Could not install the WiX UI extension." }

      - name: Build branded MoodPress MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:MOODPRESS_PROJECT_ROOT
          $publishDir = Join-Path $env:MOODPRESS_PROJECT_ROOT "publish"
          $required = @(
            "installer\Package.wxs",
            "installer\Voorwaarden.rtf",
            "installer\banner.bmp",
            "installer\dialoog.bmp",
            "MoodPress.WindowsApp\Resources\AppIcon\MoodPress.ico",
            (Join-Path $publishDir "MoodPress.exe")
          )
          foreach ($file in $required) { if (!(Test-Path $file)) { throw "Required installer file missing: $file" } }

          # WiX resolves relative Files/Exclude globs relative to Package.wxs, so
          # 'PublishDir=publish' incorrectly points at installer\publish. Pass
          # the absolute publish folder so the MSI embeds all MAUI/runtime files.
          $publishedFiles = @(Get-ChildItem $publishDir -Recurse -File)
          if ($publishedFiles.Count -lt 10) {
            throw "Only $($publishedFiles.Count) files were found in the published app. Refusing to create an incomplete MSI."
          }
          Write-Host "Files in complete published app: $($publishedFiles.Count)"
          $publishDirForWix = $publishDir
          $wixOutput = & wix build installer\Package.wxs `
            -ext WixToolset.UI.wixext `
            -culture nl-NL `
            -arch x64 `
            -d "PublishDir=$publishDirForWix" `
            -o MoodPress-Windows-Setup.msi 2>&1
          $wixExitCode = $LASTEXITCODE
          $wixOutput | ForEach-Object { Write-Host $_ }
          $wixText = $wixOutput | Out-String
          if ($wixExitCode -ne 0) { throw "WiX could not build the MoodPress MSI." }
          if ($wixText -match "WIX8601") {
            throw "WiX could not find the publish directory while harvesting files. Refusing to ship a broken MSI."
          }
          $msi = Join-Path $env:MOODPRESS_PROJECT_ROOT "MoodPress-Windows-Setup.msi"
          if (!(Test-Path $msi)) { throw "MSI output was not created." }

          # Inspect the MSI File table: an MSI containing only the launcher can
          # build successfully but will not start because the dependencies are absent.
          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase($msi, 0)
          $view = $database.OpenView('SELECT `File` FROM `File`')
          $view.Execute()
          $msiFileCount = 0
          while ($null -ne $view.Fetch()) { $msiFileCount++ }
          $view.Close()
          Write-Host "Files embedded in MSI: $msiFileCount"
          if ($msiFileCount -lt 10) {
            throw "The MSI contains only $msiFileCount files, although the publish folder contains $($publishedFiles.Count). Refusing to ship an incomplete MSI."
          }
          Write-Host "Created branded MoodPress MSI with harvested runtime files: $msi"

      - name: Collect installer, portable app and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:MOODPRESS_PROJECT_ROOT "MoodPress-Windows-Setup.msi") -Destination (Join-Path $artifactDir "MoodPress-Windows-Setup.msi") -Force
          $portableStage = Join-Path $artifactDir "MoodPress-Windows-Portable"
          New-Item -ItemType Directory -Force -Path $portableStage | Out-Null
          Copy-Item -Path (Join-Path $env:MOODPRESS_PROJECT_ROOT "publish\*") -Destination $portableStage -Recurse -Force
          Compress-Archive -Path (Join-Path $portableStage "*") -DestinationPath (Join-Path $artifactDir "MoodPress-Windows-Portable.zip") -Force
          Remove-Item $portableStage -Recurse -Force
          Get-ChildItem $artifactDir -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Substring($artifactDir.Length + 1))" } |
            Set-Content (Join-Path $artifactDir "SHA256SUMS.txt")
          Get-ChildItem $artifactDir -File | Select-Object Name, Length

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-Windows-2.3.0
          path: artifacts/windows/**
          if-no-files-found: error
          retention-days: 30
