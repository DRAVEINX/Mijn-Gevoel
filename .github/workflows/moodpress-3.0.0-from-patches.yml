name: MoodPress 3.3.0 - all platforms, complete accessibility and workspaces
on:
  workflow_dispatch:
  push:
    branches:
      - feature/complete-accessible-upgrade
    paths:
      - 'upgrade-patches/READY'

permissions:
  contents: read

concurrency:
  group: moodpress-3.3.0-release-repair-20261015
  cancel-in-progress: false

jobs:
  upgrade-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch and existing source archives
        uses: actions/checkout@v4

      - name: Validate original 2.5.2 source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t 'MoodPress-Android-compleet-2.5.2.zip'
          mkdir -p source
          unzip -q 'MoodPress-Android-compleet-2.5.2.zip' -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Apply all reviewed feature-branch patches
        shell: bash
        run: |
          set -euo pipefail
          test -f upgrade-patches/01-android-navigation.patch
          test -f upgrade-patches/02a-android-speech.patch
          test -f upgrade-patches/02b-android-workspace.patch
          test -f upgrade-patches/03-core-workspaces.patch
          test -f upgrade-patches/04-tests-version-home.patch
          test -f upgrade-patches/05-desktop-workspace.patch
          cat upgrade-patches/01-android-navigation.patch \
              upgrade-patches/02a-android-speech.patch \
              upgrade-patches/02b-android-workspace.patch \
              upgrade-patches/03-core-workspaces.patch \
              upgrade-patches/04-tests-version-home.patch \
              upgrade-patches/05-desktop-workspace.patch > /tmp/moodpress-3.0.0.patch
          cd source
          patch --batch --forward -p1 < /tmp/moodpress-3.0.0.patch
          cd ..
          test -f source/MijnGevoel-Android/MijnGevoel.Android/WorkspacePage.cs
          test -f source/MijnGevoel-Android/MijnGevoel.Core/Data/WorkspaceRecordService.cs
          test -f source/MijnGevoel-Android/MijnGevoel.Desktop/Views/WorkspaceView.cs
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/WorkspaceRoleServiceTests.cs

          # Incremental 3.1.0 upgrade: verify all seven transported segments before decoding.
          test "$(find upgrade-patches -maxdepth 1 -type f -name '06-part-*.b64' | wc -l)" -eq 7
          cat upgrade-patches/06-part-*.b64 > /tmp/moodpress-3.1.0.patch.gz.b64
          base64 --decode /tmp/moodpress-3.1.0.patch.gz.b64 > /tmp/moodpress-3.1.0.patch.gz
          echo 'ac4597e1e1ee71f5288cbba0789e2935e94228540449eb5b5b7305a24e850d1e  /tmp/moodpress-3.1.0.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/moodpress-3.1.0.patch.gz > /tmp/moodpress-3.1.0.patch
          (cd source && patch --batch --forward -p1 < /tmp/moodpress-3.1.0.patch)

          test -f upgrade-patches/07-fix-pdf-date-nullability.patch
          (cd source && patch --batch --forward -p1 < ../upgrade-patches/07-fix-pdf-date-nullability.patch)

          # Incremental 3.2.0 voice-output upgrade.
          test "$(find upgrade-patches -maxdepth 1 -type f -name '08-part-*.b64' | wc -l)" -eq 2
          cat upgrade-patches/08-part-*.b64 > /tmp/moodpress-3.2.0.patch.gz.b64
          base64 --decode /tmp/moodpress-3.2.0.patch.gz.b64 > /tmp/moodpress-3.2.0.patch.gz
          echo 'dbdc02380d0471ea518b88cf92ad3393ff333197413540e7cd86a750da1b3330  /tmp/moodpress-3.2.0.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/moodpress-3.2.0.patch.gz > /tmp/moodpress-3.2.0.patch
          (cd source && patch --batch --forward -p1 < /tmp/moodpress-3.2.0.patch)

          test -f upgrade-patches/09-fix-tts-cancellation.patch
          (cd source && patch --batch --forward -p1 < ../upgrade-patches/09-fix-tts-cancellation.patch)

          # 3.3.0 closes Windows voice parity: explicit Dutch dictation and encrypted voice-note capture/playback.
          test "$(find upgrade-patches -maxdepth 1 -type f -name '11-windows-voice-part-*.b64' | wc -l)" -eq 3
          cat upgrade-patches/11-windows-voice-part-*.b64 > /tmp/moodpress-windows-3.3.0.patch.gz.b64
          base64 --decode /tmp/moodpress-windows-3.3.0.patch.gz.b64 > /tmp/moodpress-windows-3.3.0.patch.gz
          echo '323bf5a1fafae932fb44782c3b329760e36094415e05b967bba4b1d23913d927  /tmp/moodpress-windows-3.3.0.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/moodpress-windows-3.3.0.patch.gz > /tmp/moodpress-windows-3.3.0.patch
          # Apply shared Windows features; only the Android package metadata hunk is allowed to reject.
          set +e
          (cd source && patch --batch --forward -p1 < /tmp/moodpress-windows-3.3.0.patch)
          patch_status=$?
          set -e
          project_reject='source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj.rej'
          other_reject="$(find source -type f -name '*.rej' ! -path "$project_reject" -print -quit)"
          if [[ -n "$other_reject" ]]; then echo "Unexpected patch reject: $other_reject" >&2; exit 1; fi
          if [[ -f "$project_reject" ]]; then rm -f "$project_reject"; elif [[ "$patch_status" -ne 0 ]]; then exit "$patch_status"; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj')
          s=p.read_text(encoding='utf-8')
          for tag,value in {'ApplicationId':'nl.mijngevoel.app','ApplicationTitle':'MoodPress','ApplicationDisplayVersion':'3.3.0','ApplicationVersion':'38'}.items():
              pattern=rf'<{tag}>.*?</{tag}>'
              if not re.search(pattern,s,re.S): raise SystemExit(f'Missing project property {tag}')
              s=re.sub(pattern,f'<{tag}>{value}</{tag}>',s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY

          # Accessible quick-help entry on the Home screen; applies to phone and tablet layouts.
          test -f upgrade-patches/12-accessibility-quick-help.patch
          (cd source && patch --batch --forward -p1 < ../upgrade-patches/12-accessibility-quick-help.patch)
          test -f upgrade-patches/13-multiple-feelings.patch
          (cd source && patch --batch --forward -p1 < ../upgrade-patches/13-multiple-feelings.patch)

          test -f source/MijnGevoel-Android/MijnGevoel.Android/SpeechOutput.cs
          test -f source/MijnGevoel-Android/MijnGevoel.Desktop/DesktopSpeechInput.cs
          test -f source/MijnGevoel-Android/RELEASE-NOTES-3.2.0.md
          test -f source/MijnGevoel-Android/RELEASE-NOTES-3.3.0.md
          test -f source/MijnGevoel-Android/docs/quality/VOICE-ACCESSIBILITY-3.3.0.md
          test -f source/MijnGevoel-Android/MijnGevoel.Core/Data/WorkspaceReportService.cs
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/WorkspaceReportServiceTests.cs
          test -f source/MijnGevoel-Android/RELEASE-NOTES-3.1.0.md
          test -f source/MijnGevoel-Android/docs/quality/WORKSPACES-3.1.0.md

      - name: Static preflight for version, roles, catalog and archive integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections, re, xml.etree.ElementTree as ET
          root=Path('source/MijnGevoel-Android')
          tree=ET.parse(root/'MijnGevoel.Android/MijnGevoel.Android.csproj')
          def prop(name):
              values=[e.text or '' for e in tree.iter(name)]
              return values[-1] if values else None
          actual=(prop('TargetFramework'),prop('ApplicationId'),prop('ApplicationTitle'),prop('ApplicationDisplayVersion'),prop('ApplicationVersion'))
          expected=('net10.0-android','nl.mijngevoel.app','MoodPress','3.3.0','38')
          if actual != expected: raise SystemExit(f'Versieconfiguratie: gevonden {actual}, verwacht {expected}')
          dashboard=(root/'MijnGevoel.Android/DashboardPage.cs').read_text(encoding='utf-8')
          match=re.search(r'public enum FeatureKind\s*\{([^}]+)\}',dashboard,re.S)
          if not match: raise SystemExit('FeatureKind enum ontbreekt')
          kinds=[x.strip() for x in match.group(1).replace('\n',' ').split(',') if x.strip()]
          catalog=(root/'MijnGevoel.Android/FeatureCatalog.cs').read_text(encoding='utf-8')
          entries=re.findall(r'new\(FeatureKind\.(\w+),',catalog)
          counts=collections.Counter(entries)
          if collections.Counter(kinds)!=counts:
              raise SystemExit(f'Featurecatalogus mismatch: missing={set(kinds)-set(entries)}, extra={set(entries)-set(kinds)}, duplicates={[k for k,v in counts.items() if v>1]}')
          if not {'PersonalSpace','CaregiverSpace','ParentGuardianSpace'}.issubset(set(kinds)):
              raise SystemExit('Er ontbreken omgevingen in FeatureKind')
          for name in ['WorkspaceRoleService.cs','WorkspaceRecordService.cs','WorkspaceModels.cs','WorkspaceReportService.cs']:
              if not (root/'MijnGevoel.Core/Data'/name).is_file(): raise SystemExit(f'Ontbreekt: {name}')
          for name in ['WorkspacePage.cs','SpeechInput.cs','SpeechOutput.cs']:
              if not (root/'MijnGevoel.Desktop/DesktopSpeechInput.cs').is_file(): raise SystemExit('Ontbreekt: DesktopSpeechInput.cs')
              if not (root/'MijnGevoel.Android'/name).is_file(): raise SystemExit(f'Ontbreekt: {name}')
          for p in ['MijnGevoel.Tests/WorkspaceReportServiceTests.cs','RELEASE-NOTES-3.1.0.md','docs/quality/WORKSPACES-3.1.0.md','RELEASE-NOTES-3.2.0.md','docs/quality/VOICE-ACCESSIBILITY-3.2.0.md','RELEASE-NOTES-3.3.0.md','docs/quality/VOICE-ACCESSIBILITY-3.3.0.md']:
              if not (root/p).is_file(): raise SystemExit(f'Ontbreekt: {p}')
          report_ui=(root/'MijnGevoel.Android/WorkspacePage.cs').read_text(encoding='utf-8')
          if 'var reportStart = (startDate.Date ??' not in report_ui or 'endDate.Date.Date' in report_ui:
              raise SystemExit('Nullable datumcontrole voor PDF rapport is niet correct.')
          print(f'Statische controles geslaagd voor MoodPress {actual[3]} met {len(entries)} features.')
          PY
          (cd source && zip -qr -X ../MoodPress-Android-compleet-3.3.0.zip MijnGevoel-Android)
          unzip -t MoodPress-Android-compleet-3.3.0.zip

      - name: Upload de bijgewerkte broncode, ook als een volgende stap faalt
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Android-compleet-3.3.0-source
          path: MoodPress-Android-compleet-3.3.0.zip
          if-no-files-found: error
          retention-days: 14

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore and run Core tests
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Build Android phone test APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Debug \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationId=nl.mijngevoel.app.debug \
            "-p:ApplicationTitle=MoodPress Telefoon Test"
          output='MijnGevoel.Android/bin/Debug/net10.0-android'
          phone_apk="$(find "$output" -type f -iname '*app.debug*apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$phone_apk" && test -f "$phone_apk"
          mkdir -p artifacts
          cp "$phone_apk" artifacts/MoodPress-Android-Telefoon-3.3.0-debug.apk

      - name: Build Android tablet test APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Debug \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationId=nl.mijngevoel.app.tablet.debug \
            "-p:ApplicationTitle=MoodPress Tablet Test"
          output='MijnGevoel.Android/bin/Debug/net10.0-android'
          tablet_apk="$(find "$output" -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$tablet_apk" && test -f "$tablet_apk"
          cp "$tablet_apk" artifacts/MoodPress-Android-Tablet-3.3.0-debug.apk

      - name: Validate phone APK, tablet APK and generate checksums
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          phone='artifacts/MoodPress-Android-Telefoon-3.3.0-debug.apk'
          tablet='artifacts/MoodPress-Android-Tablet-3.3.0-debug.apk'
          for apk in "$phone" "$tablet"; do
            echo "Checking APK: $apk"
            if [ ! -s "$apk" ]; then
              echo "APK ontbreekt of is leeg: $apk" >&2
              ls -lah artifacts >&2 || true
              exit 1
            fi
            if ! unzip -t "$apk"; then
              echo "APK is geen geldige ZIP/APK: $apk" >&2
              file "$apk" >&2 || true
              exit 1
            fi
            if ! unzip -Z1 "$apk" | grep -Fq 'AndroidManifest.xml'; then
              echo "AndroidManifest.xml ontbreekt in $apk. Inhoud van APK:" >&2
              unzip -Z1 "$apk" | head -n 80 >&2 || true
              exit 1
            fi
            echo "APK-controle geslaagd: $apk"
          done
          if [ -s ../../MoodPress-Android-compleet-3.3.0.zip ]; then
            cp ../../MoodPress-Android-compleet-3.3.0.zip artifacts/
          fi
          (cd artifacts && sha256sum MoodPress-Android-Telefoon-3.3.0-debug.apk MoodPress-Android-Tablet-3.3.0-debug.apk > SHA256SUMS.txt)
          if [ -s artifacts/MoodPress-Android-compleet-3.3.0.zip ]; then
            (cd artifacts && sha256sum MoodPress-Android-compleet-3.3.0.zip >> SHA256SUMS.txt)
          fi

      - name: Upload phone and tablet test APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Android-Phone-Tablet-3.3.0-test-apks
          path: source/MijnGevoel-Android/artifacts/
          if-no-files-found: error
          retention-days: 14


      - name: Prepare Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?GitHub secret ANDROID_KEYSTORE_BASE64 ontbreekt}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moodpress-release.keystore"
          test -s "$RUNNER_TEMP/moodpress-release.keystore"
          chmod 600 "$RUNNER_TEMP/moodpress-release.keystore"

      - name: Build signed phone release APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?GitHub secret ANDROID_KEYSTORE_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_PASSWORD:?GitHub secret ANDROID_KEY_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_ALIAS:?GitHub secret ANDROID_KEY_ALIAS ontbreekt}"
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release --framework net10.0-android \
            -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:ApplicationId=nl.mijngevoel.app -p:ApplicationTitle=MoodPress \
            -p:ApplicationDisplayVersion=3.3.0 -p:ApplicationVersion=38
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          apk="$(find "$output" -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp "$apk" "$GITHUB_WORKSPACE/release-artifacts/MoodPress-Android-Telefoon-3.3.0-release.apk"

      - name: Build signed tablet release APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release --framework net10.0-android \
            -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:ApplicationId=nl.mijngevoel.app.tablet -p:ApplicationTitle="MoodPress Tablet" \
            -p:ApplicationDisplayVersion=3.3.0 -p:ApplicationVersion=38
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          apk="$(find "$output" -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/release-artifacts/MoodPress-Android-Tablet-3.3.0-release.apk"

      - name: Build signed phone release AAB
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?GitHub secret ANDROID_KEYSTORE_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_PASSWORD:?GitHub secret ANDROID_KEY_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_ALIAS:?GitHub secret ANDROID_KEY_ALIAS ontbreekt}"
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release --framework net10.0-android \
            -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:ApplicationId=nl.mijngevoel.app -p:ApplicationTitle=MoodPress \
            -p:ApplicationDisplayVersion=3.3.0 -p:ApplicationVersion=38
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          bundle="$(find "$output" -type f -iname '*.aab' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$bundle" && test -s "$bundle"
          cp "$bundle" "$GITHUB_WORKSPACE/release-artifacts/MoodPress-Android-Telefoon-3.3.0-release.aab"

      - name: Build signed tablet release AAB
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release --framework net10.0-android \
            -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:ApplicationId=nl.mijngevoel.app.tablet -p:ApplicationTitle="MoodPress Tablet" \
            -p:ApplicationDisplayVersion=3.3.0 -p:ApplicationVersion=38
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          bundle="$(find "$output" -type f -iname '*.aab' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$bundle" && test -s "$bundle"
          cp "$bundle" "$GITHUB_WORKSPACE/release-artifacts/MoodPress-Android-Tablet-3.3.0-release.aab"

      - name: Verify signed phone and tablet AABs and checksums
        shell: bash
        run: |
          set -euo pipefail
          for bundle in release-artifacts/*.aab; do
            test -s "$bundle"
            unzip -t "$bundle" >/dev/null
            zipinfo -1 "$bundle" | grep -q '^base/manifest/AndroidManifest.xml$'
          done
          (cd release-artifacts && sha256sum *.aab > AAB-SHA256SUMS.txt)

      - name: Upload signed phone and tablet release AABs
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Android-Phone-Tablet-3.3.0-release-AAB
          path: release-artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Verify and upload signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer" && test -f "$signer"
          for apk in release-artifacts/*.apk; do
            test -s "$apk"
            unzip -t "$apk" >/dev/null
            zipinfo -1 "$apk" | grep -q 'AndroidManifest.xml'
            "$signer" verify --verbose "$apk"
          done
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload signed phone and tablet release APKs
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Android-Phone-Tablet-3.3.0-release
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

  windows-desktop-build:
    name: Windows desktop build and regression tests
    needs: upgrade-and-build
    runs-on: windows-latest
    steps:
      - name: Download the same validated 3.3.0 source archive
        uses: actions/download-artifact@v4
        with:
          name: MoodPress-Android-compleet-3.3.0-source
          path: incoming

      - name: Unpack the validated source archive
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "incoming/MoodPress-Android-compleet-3.3.0.zip"
          if (!(Test-Path $archive)) { throw "Validated source archive is missing: $archive" }
          Expand-Archive -LiteralPath $archive -DestinationPath "$PWD/source" -Force
          if (!(Test-Path "$PWD/source/MijnGevoel-Android/MijnGevoel.Desktop/MijnGevoel.Desktop.csproj")) { throw "Desktop project not found." }

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and run regression tests on Windows
        working-directory: source/MijnGevoel-Android
        shell: pwsh
        run: |
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build self-contained Windows desktop app
        working-directory: source/MijnGevoel-Android
        shell: pwsh
        run: |
          dotnet restore MijnGevoel.Desktop/MijnGevoel.Desktop.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish MijnGevoel.Desktop/MijnGevoel.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $publish = "MijnGevoel.Desktop/bin/Release/net8.0-windows/win-x64/publish"
          if (!(Test-Path "$publish/MoodPress.exe")) { throw "Expected MoodPress.exe was not created." }
          New-Item -ItemType Directory -Path "$PWD/artifacts" -Force | Out-Null
          Compress-Archive -Path "$publish/*" -DestinationPath "$PWD/artifacts/MoodPress-Windows-3.3.0-portable.zip" -Force

      - name: Install WiX 5 for Windows MSI packaging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tool = dotnet tool list --global | Select-String '^\s*wix\s'
          if ($tool) { dotnet tool update --global wix --version 5.0.2 }
          else { dotnet tool install --global wix --version 5.0.2 }
          if ($LASTEXITCODE -ne 0) { throw "WiX 5.0.2 install failed." }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX UI extension install failed." }

      - name: Build and validate the full MoodPress MSI
        working-directory: source/MijnGevoel-Android
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = Join-Path $PWD "MijnGevoel.Desktop/bin/Release/net8.0-windows/win-x64/publish"
          if (!(Test-Path (Join-Path $publishDir "MoodPress.exe"))) { throw "MoodPress.exe is missing from the self-contained publish folder." }
          $wxsPath = Join-Path $PWD "installer/Package.wxs"
          if (!(Test-Path $wxsPath)) { throw "installer/Package.wxs was not found." }
          $wxs = Get-Content -LiteralPath $wxsPath -Raw
          $wxs = $wxs.Replace('Name="Mijn Gevoel" Manufacturer="Mijn Gevoel" Version="1.0.8"', 'Name="MoodPress" Manufacturer="DRAVEINX" Version="3.3.0"')
          $wxs = $wxs.Replace('<SummaryInformation Description="Mijn Gevoel - installatie" />', '<SummaryInformation Description="MoodPress - installatie" />')
          $wxs = $wxs.Replace('<Feature Id="Main" Title="Mijn Gevoel"', '<Feature Id="Main" Title="MoodPress"')
          $wxs = $wxs.Replace('Source="$(PublishDir)\MijnGevoel.exe"', 'Source="$(PublishDir)\MoodPress.exe"')
          $wxs = $wxs.Replace('Name="Mijn Gevoel"', 'Name="MoodPress"')
          if (-not $wxs.Contains('<Files Include="$(PublishDir)\**"')) {
            # The Files wildcard installs every published file, including MoodPress.exe.
            # Remove the explicit EXE File row first to avoid duplicate MSI file entries.
            # Remove the explicit MainExecutable component so the wildcard harvest owns the EXE once.
            $wxs = [regex]::Replace($wxs, '(?s)\s*<Component\b(?=[^>]*\bId="MainExecutable")[^>]*>.*?</Component>', '')
          # The Files harvest replaces the old explicit EXE component, so remove its stale launch action.
          $wxs = $wxs.Replace('    <CustomAction Id="StartApp" FileRef="MijnGevoelExe" ExeCommand="" Return="asyncNoWait" />', '')
          $wxs = $wxs.Replace('      <Publish Dialog="ExitDialog" Control="Finish" Event="DoAction" Value="StartApp" Condition="WIXUI_EXITDIALOGOPTIONALCHECKBOX = 1 AND NOT Installed" />', '')
            $componentGroupEnd = '    </ComponentGroup>'
            $filesElement = '      <Files Include="$(PublishDir)\**" />' + [Environment]::NewLine + $componentGroupEnd
            $wxs = $wxs.Replace($componentGroupEnd, $filesElement)
          }
          Set-Content -LiteralPath $wxsPath -Value $wxs -Encoding utf8
          $required = @(
            $wxsPath,
            (Join-Path $PWD "installer/Voorwaarden.rtf"),
            (Join-Path $PWD "installer/banner.bmp"),
            (Join-Path $PWD "installer/dialoog.bmp"),
            (Join-Path $PWD "MijnGevoel.Desktop/Assets/MijnGevoel.ico"),
            (Join-Path $publishDir "MoodPress.exe")
          )
          foreach ($item in $required) { if (!(Test-Path $item)) { throw "Required MSI file missing: $item" } }
          $msi = Join-Path $PWD "artifacts/MoodPress-Windows-3.3.0-Setup.msi"
          New-Item -ItemType Directory -Path (Split-Path $msi) -Force | Out-Null
          wix build $wxsPath -ext WixToolset.UI.wixext -culture nl-NL -arch x64 -d "PublishDir=$publishDir" -o $msi
          if ($LASTEXITCODE -ne 0) { throw "WiX could not build the MSI." }
          if (!(Test-Path $msi)) { throw "MSI output was not created." }
          $publishedFiles = @(Get-ChildItem -LiteralPath $publishDir -Recurse -File)
          if ($publishedFiles.Count -lt 1) { throw "The published app is empty." }
          $windowsInstaller = New-Object -ComObject WindowsInstaller.Installer
          $database = $windowsInstaller.OpenDatabase($msi, 0)
          $view = $database.OpenView('SELECT * FROM File')
          $view.Execute()
          $msiFileCount = 0
          while ($null -ne $view.Fetch()) { $msiFileCount++ }
          $view.Close()
          if ($msiFileCount -lt 1) { throw "The MSI has no installed file records." }
          Write-Host "Validated MSI with $msiFileCount file records from a $($publishedFiles.Count)-file publish folder."
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  MoodPress-Windows-3.3.0-Setup.msi" | Set-Content (Join-Path (Split-Path $msi) "SHA256SUMS.txt") -Encoding utf8

      - name: Upload Windows portable build and MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-Windows-3.3.0-builds
          path: source/MijnGevoel-Android/artifacts/*
          if-no-files-found: error
          retention-days: 14

  ios-simulator-build:
    name: iPhone/iPad simulator build and shared regression tests
    needs: upgrade-and-build
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out current feature branch
        uses: actions/checkout@v4

      - name: Download validated shared 3.3.0 source
        uses: actions/download-artifact@v4
        with:
          name: MoodPress-Android-compleet-3.3.0-source
          path: incoming

      - name: Apply the iOS platform port to the same shared source
        shell: bash
        run: |
          set -euo pipefail
          archive='incoming/MoodPress-Android-compleet-3.3.0.zip'
          test -f "$archive"
          unzip -t "$archive"
          mkdir -p source artifacts/ios
          unzip -q "$archive" -d source
          test "$(find upgrade-patches -maxdepth 1 -type f -name '10-ios-part-*.b64' | wc -l)" -eq 6
          cat upgrade-patches/10-ios-part-*.b64 > /tmp/moodpress-ios-3.2.0.patch.gz.b64
          base64 -D -i /tmp/moodpress-ios-3.2.0.patch.gz.b64 -o /tmp/moodpress-ios-3.2.0.patch.gz
          echo 'f2a679fdb5d8132d9813dd7f4d83b3a2e100fe5ffc7920503414a2560b9a659e  /tmp/moodpress-ios-3.2.0.patch.gz' | shasum -a 256 -c -
          gzip --decompress --stdout /tmp/moodpress-ios-3.2.0.patch.gz > /tmp/moodpress-ios-3.2.0.patch
          (cd source && patch --batch --forward -p1 < /tmp/moodpress-ios-3.2.0.patch)
          project='source/MijnGevoel-Android/MijnGevoel.Android/MoodPress.iOS.csproj'
          test -f "$project"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('source/MijnGevoel-Android/MijnGevoel.Android/MoodPress.iOS.csproj')
          s=p.read_text(encoding='utf-8')
          for tag, value in [('ApplicationDisplayVersion','3.3.0'),('ApplicationVersion','38')]:
              s,n=re.subn(rf'<{tag}>.*?</{tag}>',f'<{tag}>{value}</{tag}>',s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'Could not update iOS property {tag}')
          p.write_text(s,encoding='utf-8')
          quality=Path('source/MijnGevoel-Android/docs/quality')
          for old_name,new_name in [('IOS-STATUS-3.2.0.md','IOS-STATUS-3.3.0.md'),('VALIDATIERAPPORT-3.2.0.md','VALIDATIERAPPORT-3.3.0.md')]:
              old=quality/old_name
              if old.exists():
                  data=old.read_text(encoding='utf-8').replace('3.2.0','3.3.0')
                  (quality/new_name).write_text(data,encoding='utf-8')
          PY
          grep -q '<TargetFramework>net10.0-ios</TargetFramework>' "$project"
          grep -q '<ApplicationDisplayVersion>3.3.0</ApplicationDisplayVersion>' "$project"
          grep -q '<ApplicationVersion>38</ApplicationVersion>' "$project"
          grep -q 'NSSpeechRecognitionUsageDescription' source/MijnGevoel-Android/MijnGevoel.Android/Platforms/iOS/Info.plist
          grep -q 'NSFaceIDUsageDescription' source/MijnGevoel-Android/MijnGevoel.Android/Platforms/iOS/Info.plist
          echo 'Shared 3.3.0 source and iOS platform adapters validated.'

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401

      - name: Verify Xcode and .NET versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          dotnet --list-sdks
          dotnet --info

      - name: Run shared Core regression tests on macOS
        shell: bash
        run: |
          set -euo pipefail
          dotnet test source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Install .NET MAUI workload
        run: dotnet workload install maui --version 10.0.401.1

      - name: Build iOS Simulator app (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          cd source/MijnGevoel-Android/MijnGevoel.Android
          if [[ "$(uname -m)" == "arm64" ]]; then RID='iossimulator-arm64'; else RID='iossimulator-x64'; fi
          dotnet build MoodPress.iOS.csproj \
            --configuration Debug \
            --framework net10.0-ios \
            -p:RuntimeIdentifier="$RID" \
            -p:EnableCodeSigning=false
          APP_PATH="$(find bin-ios/Debug/net10.0-ios -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo 'No iOS Simulator .app bundle was produced.' >&2; find bin-ios/Debug -maxdepth 7 -print; exit 1; }
          ditto "$APP_PATH" ../../../artifacts/ios/MoodPress-iOS-3.3.0-Simulator.app
          ditto -c -k --sequesterRsrc --keepParent ../../../artifacts/ios/MoodPress-iOS-3.3.0-Simulator.app ../../../artifacts/ios/MoodPress-iOS-3.3.0-Simulator.zip
          shasum -a 256 ../../../artifacts/ios/MoodPress-iOS-3.3.0-Simulator.zip | tee ../../../artifacts/ios/SHA256SUMS.txt

      - name: Upload unsigned iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-iOS-3.3.0-Simulator
          path: artifacts/ios/*
          if-no-files-found: error
          retention-days: 14

  ios-device-release:
    name: iPhone/iPad device build and signed IPA
    needs: [upgrade-and-build, ios-simulator-build]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out release workflow and patches
        uses: actions/checkout@v4

      - name: Check Apple signing configuration
        id: signing
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          IOS_CODESIGN_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=()
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_CODESIGN_KEY IOS_CODESIGN_PROVISION IOS_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            {
              echo "## iPhone/iPad-release: ondertekening nog niet geconfigureerd"
              echo
              echo "De simulatorbuild is geslaagd, maar voor een installeerbare IPA ontbreken deze GitHub Actions secrets:"
              for name in "${missing[@]}"; do echo "- `$name`"; done
              echo
              echo "Voeg deze waarden toe via Settings → Secrets and variables → Actions. Plaats certificaten, wachtwoorden of provisioningprofielen niet in de chat."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the validated shared source
        if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MoodPress-Android-compleet-3.3.0-source
          path: incoming
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare iOS device source
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q incoming/MoodPress-Android-compleet-3.3.0.zip -d source
          test "$(find upgrade-patches -maxdepth 1 -type f -name '10-ios-part-*.b64' | wc -l)" -eq 6
          cat upgrade-patches/10-ios-part-*.b64 > /tmp/moodpress-ios.patch.gz.b64
          base64 -D -i /tmp/moodpress-ios.patch.gz.b64 -o /tmp/moodpress-ios.patch.gz
          echo 'f2a679fdb5d8132d9813dd7f4d83b3a2e100fe5ffc7920503414a2560b9a659e  /tmp/moodpress-ios.patch.gz' | shasum -a 256 -c -
          gzip -dc /tmp/moodpress-ios.patch.gz > /tmp/moodpress-ios.patch
          (cd source && patch --batch --forward -p1 < /tmp/moodpress-ios.patch)
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MoodPress.iOS.csproj

      - name: Install .NET and MAUI iOS workload
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.401

      - name: Install MAUI workload
        if: steps.signing.outputs.ready == 'true'
        run: dotnet workload install maui --version 10.0.401.1

      - name: Import Apple signing certificate and provisioning profile
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/moodpress-signing.keychain-db"
          security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/apple-signing.p12"
          security import "$RUNNER_TEMP/apple-signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/moodpress.mobileprovision"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(/usr/bin/security cms -D -i "$RUNNER_TEMP/moodpress.mobileprovision")")
          cp "$RUNNER_TEMP/moodpress.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Build and verify signed iPhone/iPad IPA
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          IOS_CODESIGN_KEY: ${{ secrets.IOS_CODESIGN_KEY }}
          IOS_CODESIGN_PROVISION: ${{ secrets.IOS_CODESIGN_PROVISION }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cd source/MijnGevoel-Android/MijnGevoel.Android
          dotnet publish MoodPress.iOS.csproj --configuration Release --framework net10.0-ios --runtime ios-arm64 -p:ArchiveOnBuild=true -p:EnableCodeSigning=true -p:CodesignKey="$IOS_CODESIGN_KEY" -p:CodesignProvision="$IOS_CODESIGN_PROVISION" -p:CodesignTeamId="$IOS_TEAM_ID" -p:ApplicationDisplayVersion=3.3.0 -p:ApplicationVersion=38
          mkdir -p ../../../artifacts/ios-device
          IPA="$(find bin/Release/net10.0-ios -type f -name '*.ipa' -print -quit)"
          if [[ -z "$IPA" ]]; then
            IPA="$(find bin -type f -path '*Release*' -name '*.ipa' -print -quit)"
          fi
          test -n "$IPA" && test -s "$IPA"
          cp "$IPA" ../../../artifacts/ios-device/MoodPress-iOS-3.3.0.ipa
          unzip -t ../../../artifacts/ios-device/MoodPress-iOS-3.3.0.ipa
          shasum -a 256 ../../../artifacts/ios-device/MoodPress-iOS-3.3.0.ipa > ../../../artifacts/ios-device/SHA256SUMS.txt

      - name: Upload signed iPhone/iPad IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MoodPress-iOS-3.3.0-Device-IPA
          path: artifacts/ios-device/*
          if-no-files-found: error
          retention-days: 30
