name: MoodPress 2.5.0 - Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-2.5.0.yml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Core-tests, ondertekende APK en Google Play AAB
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v7

      - name: Controleer broncode-ZIP en pak project uit
        shell: bash
        run: |
          set -euo pipefail
          zip_file='MoodPress-Android-compleet-2.5.0.zip'
          test -f "$zip_file" || { echo "Upload eerst $zip_file naar de hoofdmap." >&2; exit 1; }
          unzip -t "$zip_file"
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"
          mkdir -p source
          unzip -q "$zip_file" -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Controleer releaseversie, catalogus en kandidaatcode
        shell: bash
        run: |
          set -euo pipefail
          root='source/MijnGevoel-Android'
          expected_id='nl.mijngevoel.app'
          expected_title='MoodPress'
          python3 - "$root" "$expected_id" "$expected_title" <<'PYCODE'
          from pathlib import Path
          import collections, re, sys, xml.etree.ElementTree as ET
          root = Path(sys.argv[1]); expected_id = sys.argv[2]; expected_title = sys.argv[3]
          project = root / 'MijnGevoel.Android' / 'MijnGevoel.Android.csproj'
          tree = ET.parse(project)
          def prop(name):
              values = [e.text or '' for e in tree.iter(name)]
              return values[-1] if values else None
          actual = {'TargetFramework': prop('TargetFramework'), 'ApplicationId': prop('ApplicationId'),
                    'ApplicationTitle': prop('ApplicationTitle'), 'ApplicationDisplayVersion': prop('ApplicationDisplayVersion'),
                    'ApplicationVersion': prop('ApplicationVersion')}
          expected = {'TargetFramework':'net10.0-android', 'ApplicationId':expected_id,
                      'ApplicationTitle':expected_title, 'ApplicationDisplayVersion':'2.5.0', 'ApplicationVersion':'32'}
          if actual != expected:
              raise SystemExit(f'Projectconfiguratie wijkt af. Verwacht {expected}; gevonden {actual}')
          required = [
           'MijnGevoel.Core/Data/HomeShortcutService.cs',
           'MijnGevoel.Core/Data/BackupService.cs',
           'MijnGevoel.Core/Data/VaultStore.cs',
           'MijnGevoel.Core/Data/AgendaChangeService.cs',
           'MijnGevoel.Core/Data/RoutineDefinitionService.cs',
           'MijnGevoel.Core/Data/TimerSessionService.cs',
           'MijnGevoel.Core/Data/RoutineRunProgressService.cs',
           'MijnGevoel.Android/HomeShortcutSettingsPage.cs',
           'MijnGevoel.Android/MorePage.cs',
           'MijnGevoel.Android/FeatureCatalog.cs',
           'MijnGevoel.Tests/HomeShortcutServiceTests.cs',
           'MijnGevoel.Tests/RoutineDefinitionServiceTests.cs',
           'MijnGevoel.Tests/VaultStoreTests.cs',
           'MijnGevoel.Tests/AccountValidationTests.cs',
           'docs/quality/MOODPRESS-PLAN-TRACEABILITY-2.5.0.md',
           'docs/quality/ANDROID-ACCEPTATIETEST-2.5.0.md',
          ]
          missing = [p for p in required if not (root/p).is_file()]
          if missing: raise SystemExit('Ontbrekende vereiste bestanden: ' + ', '.join(missing))
          dashboard = (root/'MijnGevoel.Android/DashboardPage.cs').read_text(encoding='utf-8')
          settings = (root/'MijnGevoel.Android/FeaturePage.cs').read_text(encoding='utf-8')
          appui = (root/'MijnGevoel.Android/AppUi.cs').read_text(encoding='utf-8')
          model = (root/'MijnGevoel.Core/Data/Models.cs').read_text(encoding='utf-8')
          manifest = (root/'MijnGevoel.Android/Platforms/Android/AndroidManifest.xml').read_text(encoding='utf-8')
          if 'android:allowBackup="false"' not in manifest: raise SystemExit('Android backup-policy is niet expliciet uitgeschakeld.')
          if 'android:usesCleartextTraffic="false"' not in manifest: raise SystemExit('Cleartext traffic is niet uitgeschakeld.')
          if 'android:label="MoodPress"' in manifest: raise SystemExit('Hardcoded app-label zou debug-/tabletvariant verkeerd labelen.')
          if 'HomeShortcutService.GetVisible' not in dashboard: raise SystemExit('Home-snelkoppelingen zijn niet aan de selectie-service gekoppeld.')
          if 'new HomeShortcutSettingsPage()' not in settings: raise SystemExit('Instellingen biedt geen aparte Home-snelkoppelingenpagina.')
          if 'HomeShortcutsConfigured' not in model: raise SystemExit('Configuratiecompatibiliteit voor Home-snelkoppelingen ontbreekt.')
          routines = (root/'MijnGevoel.Android/FeaturePage.cs').read_text(encoding='utf-8')
          if 'RoutineDefinitionService.Create' not in routines: raise SystemExit('Stappenplan-editor gebruikt geen centrale invoervalidatie.')
          vault = (root/'MijnGevoel.Core/Data/VaultStore.cs').read_text(encoding='utf-8')
          vault_tests = (root/'MijnGevoel.Tests/VaultStoreTests.cs').read_text(encoding='utf-8')
          if 'ReadErrorCount' not in vault: raise SystemExit('Leesfouten van versleutelde gegevens worden niet geteld.')
          if 'MaxRecordBytes' not in vault or 'OversizedVaultFileIsIgnoredBeforeItsContentsAreRead' not in vault_tests:
              raise SystemExit('Limiet en regressietest voor grote kluisbestanden ontbreken.')
          if 'stream.ReadByte() != -1' not in vault: raise SystemExit('Begrensde leescontrole tegen bestandsgroei ontbreekt.')
          if 'if (!AppSession.Settings.SimplifiedMode' not in dashboard: raise SystemExit('Vereenvoudigde Home-weergave is niet beperkt.')
          if 'open_more_' not in (root/'MijnGevoel.Android/MorePage.cs').read_text(encoding='utf-8'): raise SystemExit('Openknoppen in Meer hebben geen unieke AutomationId.')
          if 'SemanticProperties.SetDescription(b, accessibleLabel)' not in appui: raise SystemExit('Screenreader-semantiek op ondernavigatie ontbreekt.')
          match = re.search(r'public enum FeatureKind\s*\{([^}]+)\}', dashboard, re.S)
          if not match: raise SystemExit('FeatureKind-enum ontbreekt.')
          known = [x.strip() for x in match.group(1).replace('\n',' ').split(',') if x.strip()]
          catalog = (root/'MijnGevoel.Android/FeatureCatalog.cs').read_text(encoding='utf-8')
          entries = re.findall(r'new\(FeatureKind\.(\w+),', catalog)
          counts = collections.Counter(entries)
          if collections.Counter(known) != counts:
              raise SystemExit(f'Featurecatalogus is niet exact één-op-één: missing={set(known)-set(entries)} extra={set(entries)-set(known)} duplicates={[k for k,v in counts.items() if v>1]}')
          if len(list((root/'MijnGevoel.Tests').glob('*.cs'))) < 11: raise SystemExit('Automatische testbestanden lijken onvolledig.')
          print(f'Preflight geslaagd: {actual["ApplicationTitle"]}, {actual["ApplicationId"]}, {len(entries)} catalogusfuncties.')
          PYCODE

      - name: Installeer .NET SDK's
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Installeer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Installeer MAUI Android-workload
        run: dotnet workload install maui-android

      - name: Herstel en voer alle Core-tests uit
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Decodeer ondertekeningssleutel veilig
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then echo 'GitHub Secret ANDROID_KEYSTORE_BASE64 ontbreekt.' >&2; exit 1; fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moodpress-release.keystore"
          test -s "$RUNNER_TEMP/moodpress-release.keystore"
          chmod 600 "$RUNNER_TEMP/moodpress-release.keystore"

      - name: Bouw ondertekende release-APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Secret ANDROID_KEYSTORE_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_PASSWORD:?Secret ANDROID_KEY_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_ALIAS:?Secret ANDROID_KEY_ALIAS ontbreekt}"
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Controleer APK-handtekening
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          apk="$(find "$output" -type f -iname '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -f "$apk"
          sdk="${ANDROID_SDK_ROOT:-}"
          if [[ -z "$sdk" ]]; then sdk="${ANDROID_HOME:-}"; fi
          test -n "$sdk"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer" && test -f "$signer"
          "$signer" verify --verbose "$apk"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$apk" "$GITHUB_WORKSPACE/artifacts/MoodPress-Android-release.apk"

      - name: Bouw ondertekende Google Play AAB
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release \
            --framework net10.0-android \
            -p:AndroidPackageFormat=aab \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/moodpress-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Controleer AAB-handtekening en maak SHA-256
        working-directory: source/MijnGevoel-Android
        shell: bash
        run: |
          set -euo pipefail
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          aab="$(find "$output" -type f -iname '*.aab' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$aab" && test -f "$aab"
          unzip -t "$aab"
          jarsigner -verify -verbose -certs "$aab" > "$RUNNER_TEMP/aab-signature-check.txt"
          grep -qi 'jar verified' "$RUNNER_TEMP/aab-signature-check.txt"
          cp "$aab" "$GITHUB_WORKSPACE/artifacts/MoodPress-Android-release.aab"
          cp "$GITHUB_WORKSPACE/$ZIP_FILE" "$GITHUB_WORKSPACE/artifacts/MoodPress-Android-compleet-2.5.0.zip"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum MoodPress-Android-release.apk MoodPress-Android-release.aab MoodPress-Android-compleet-2.5.0.zip | tee SHA256SUMS.txt
          ls -lh

      - name: Bewaar releasebestanden en controlesommen
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-Android-release-2.5.0
          path: |
            artifacts/MoodPress-Android-release.apk
            artifacts/MoodPress-Android-release.aab
            artifacts/MoodPress-Android-compleet-2.5.0.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verwijder tijdelijke ondertekeningssleutel
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/moodpress-release.keystore"
