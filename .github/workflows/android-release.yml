name: Mijn Gevoel - Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test and build signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find and validate Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -type f -name 'MijnGevoel-Android-compleet*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          if [[ -z "$zip_file" ]]; then
            echo "Geen MijnGevoel-Android-compleet*.zip gevonden in de hoofdmap." >&2
            exit 1
          fi
          echo "Bronbestand: $zip_file"
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"
          unzip -t "$zip_file"

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Prepare release dependencies and version
        shell: bash
        run: |
          set -euo pipefail
          project='source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj'
          test -f "$project"
          sed -E -i 's#<TargetFramework>net[0-9.]+-android</TargetFramework>#<TargetFramework>net10.0-android</TargetFramework>#' "$project"
          sed -E -i 's#<PackageReference Include="SkiaSharp" Version="[^"]+" />#<PackageReference Include="SkiaSharp" Version="3.119.4" />#' "$project"
          sed -E -i 's#<PackageReference Include="SkiaSharp.NativeAssets.Android" Version="[^"]+" />#<PackageReference Include="SkiaSharp.NativeAssets.Android" Version="3.119.4" />#' "$project"
          if ! grep -q 'PackageReference Include="Microsoft.Maui.Controls"' "$project"; then
            sed -i '/<PackageReference Include="SkiaSharp"/i\    <PackageReference Include="Microsoft.Maui.Controls" Version="10.0.110" />' "$project"
          fi
          sed -E -i 's#<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>#<ApplicationDisplayVersion>1.0.1</ApplicationDisplayVersion>#' "$project"
          sed -E -i 's#<ApplicationVersion>[^<]+</ApplicationVersion>#<ApplicationVersion>2</ApplicationVersion>#' "$project"
          grep -q '<TargetFramework>net10.0-android</TargetFramework>' "$project"
          grep -q 'SkiaSharp" Version="3.119.4"' "$project"
          grep -q 'SkiaSharp.NativeAssets.Android" Version="3.119.4"' "$project"
          grep -q 'Microsoft.Maui.Controls" Version="10.0.110"' "$project"
          echo 'Release-project settings:'
          grep -E 'TargetFramework|Application(DisplayVersion|Version)|PackageReference Include="(Microsoft.Maui.Controls|SkiaSharp|SkiaSharp.NativeAssets.Android)' "$project"

      - name: Run security tests
        working-directory: source/MijnGevoel-Android
        run: |
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Decode private signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "GitHub Secret ANDROID_KEYSTORE_BASE64 ontbreekt. Volg README-RELEASE-NL.md." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mijngevoel-release.keystore"
          test -s "$RUNNER_TEMP/mijngevoel-release.keystore"
          chmod 600 "$RUNNER_TEMP/mijngevoel-release.keystore"

      - name: Build signed release APK
        working-directory: source/MijnGevoel-Android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?GitHub Secret ANDROID_KEYSTORE_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_PASSWORD:?GitHub Secret ANDROID_KEY_PASSWORD ontbreekt}"
          : "${ANDROID_KEY_ALIAS:?GitHub Secret ANDROID_KEY_ALIAS ontbreekt}"
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj \
            --configuration Release \
            --framework net10.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/mijngevoel-release.keystore" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Locate APK and create checksum
        shell: bash
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          output='MijnGevoel.Android/bin/Release/net10.0-android'
          apk="$(find "$output" -type f -iname '*-signed.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [[ -z "$apk" ]]; then
            apk="$(find "$output" -type f -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi
          if [[ -z "$apk" || ! -f "$apk" ]]; then
            echo "De Release-build heeft geen APK opgeleverd." >&2
            find MijnGevoel.Android/bin/Release/net10.0-android -maxdepth 6 -type f -print || true
            exit 1
          fi
          cp "$apk" ../../artifacts/MijnGevoel-Android-release.apk
          cd ../../artifacts
          sha256sum MijnGevoel-Android-release.apk | tee SHA256SUMS.txt
          ls -lh

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: MijnGevoel-Android-release-apk
          path: |
            artifacts/MijnGevoel-Android-release.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing key from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mijngevoel-release.keystore"
