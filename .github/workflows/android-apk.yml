name: MoodPress 2.2 - Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MoodPress-Android-compleet-2.2.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v7

      - name: Controleer 2.2-broncode-ZIP
        shell: bash
        run: |
          set -euo pipefail
          zip_file='MoodPress-Android-compleet-2.2.zip'
          test -f "$zip_file" || { echo "Upload eerst $zip_file naar de hoofdmap." >&2; exit 1; }
          unzip -t "$zip_file"
          echo "ZIP_FILE=$zip_file" >> "$GITHUB_ENV"

      - name: Pak het project uit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Core/MijnGevoel.Core.csproj
          test -f source/MijnGevoel-Android/MijnGevoel.Tests/MijnGevoel.Tests.csproj

      - name: Installeer .NET SDK's
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Installeer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '17'

      - name: Installeer Android workload
        run: dotnet workload install maui-android

      - name: Controleer versie en Android-machtigingen
        shell: bash
        run: |
          set -euo pipefail
          project='source/MijnGevoel-Android/MijnGevoel.Android/MijnGevoel.Android.csproj'
          grep -q '<TargetFramework>net10.0-android</TargetFramework>' "$project"
          grep -q '<ApplicationDisplayVersion>2.2</ApplicationDisplayVersion>' "$project"
          grep -q '<ApplicationVersion>23</ApplicationVersion>' "$project"
          grep -q 'RoutineReminderNotifications.cs' <(find source/MijnGevoel-Android/MijnGevoel.Android -maxdepth 1 -type f -printf '%f\n')
          grep -q 'android.permission.POST_NOTIFICATIONS' source/MijnGevoel-Android/MijnGevoel.Android/Platforms/Android/AndroidManifest.xml

      - name: Voer tests uit
        working-directory: source/MijnGevoel-Android
        run: |
          dotnet restore MijnGevoel.Tests/MijnGevoel.Tests.csproj
          dotnet test MijnGevoel.Tests/MijnGevoel.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Bouw Android APK
        working-directory: source/MijnGevoel-Android
        run: |
          dotnet restore MijnGevoel.Android/MijnGevoel.Android.csproj
          dotnet publish MijnGevoel.Android/MijnGevoel.Android.csproj --configuration Debug --framework net10.0-android -p:AndroidPackageFormat=apk

      - name: Controleer APK en maak checksum
        shell: bash
        working-directory: source/MijnGevoel-Android
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts
          apk="$(find MijnGevoel.Android/bin/Debug/net10.0-android -type f -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -n "$apk" && test -f "$apk"
          cp "$apk" ../../artifacts/MoodPress-Android-debug.apk
          cd ../../artifacts
          sha256sum MoodPress-Android-debug.apk | tee SHA256SUMS.txt

      - name: Maak APK downloadbaar
        uses: actions/upload-artifact@v7
        with:
          name: MoodPress-Android-debug-apk-2.2
          path: |
            artifacts/MoodPress-Android-debug.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
